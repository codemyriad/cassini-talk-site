name: cassini.talk site

# Builds and lints every PR. After a merge to main passes, it asks the private
# codemyriad/systems repository to deploy that commit: the R2 credentials, the
# publisher and rollback live there. This repository holds only the token that
# starts that workflow, in the cassini.talk environment, which only main can use.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: cassini-talk-site-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install (fails if manifest/lockfile are missing or out of sync)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test release metadata
        run: npm test

      - name: Build
        run: npm run build

      - name: Keep the website build for review
        uses: actions/upload-artifact@v4
        with:
          name: cassini-talk-site-dist
          path: dist
          retention-days: 14
          if-no-files-found: error

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build]
    runs-on: ubuntu-latest
    environment:
      name: cassini.talk
      url: https://cassini.talk
    steps:
      - name: Start the deploy in codemyriad/systems
        env:
          GH_TOKEN: ${{ secrets.CASSINI_TALK_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          gh workflow run cassini-talk-site.yml --repo codemyriad/systems --ref master \
            -f action=deploy -f source_ref="$GITHUB_SHA"
          echo "Deploy of $GITHUB_SHA started: https://github.com/codemyriad/systems/actions/workflows/cassini-talk-site.yml" >> "$GITHUB_STEP_SUMMARY"
